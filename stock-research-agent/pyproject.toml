[project]
name = "stock-research-agent"
version = "0.1.0"
description = "主题驱动的股票研究放大器 + 个人决策框架引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

# 各阶段按需启用的可选依赖。阶段 0 仅需标准库 + pyyaml/dotenv。
[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "pandas>=2.0",
]
llm = [
    "anthropic>=0.40",
]
broker = [
    "futu-api>=8.0",
    "ib-insync>=0.9",
]
notion = [
    "notion-client>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

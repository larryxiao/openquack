[project]
name = "openquack"
version = "0.1.0"
description = "Privacy-first voice-to-text using local AI models. Speak anywhere, get organized thoughts."
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.4.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
]

[project.scripts]
openquack = "openquack.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
